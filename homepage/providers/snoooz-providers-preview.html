<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snoooz — Email providers preview</title>
<style>
html, body { margin: 0; }
/* ============================================================
   SNOOOZ HOMEPAGE — EMAIL PROVIDERS NETWORK STYLES
   Paste into your HubSpot module CSS field (or a <style> block).
   Brand tokens match the rest of the homepage.

   A hub-and-spoke diagram: Snoooz sits in the center, email providers
   around it. snoooz-providers.js draws the connector arrows between the
   real element positions and animates green dots flowing into the hub,
   so it stays aligned on any screen size.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap');

:root {
  --snoooz-bg: #f7f9f4;
  --snoooz-text: #102421;
  --snoooz-muted: #60706d;
  --snoooz-border: #dfe8e2;
  --snoooz-primary: #0F5B44;
  --snoooz-primary-hover: #053533;
  --snoooz-secondary: #D6D9A0;
  --snoooz-secondary-hover: #A5AE47;
  --snoooz-secondary-soft: rgba(214, 217, 160, 0.26);
  --snoooz-shadow: 0 18px 50px rgba(15, 91, 68, 0.06);
  --snoooz-dot: #18a76c;
  --snoooz-max: 1180px;
}

.snoooz-net,
.snoooz-net *,
.snoooz-net *::before,
.snoooz-net *::after { box-sizing: border-box; }

.snoooz-net {
  width: 100%;
  margin: 0;
  color: var(--snoooz-text);
  font-family: "Open Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 50% 12%, rgba(214, 217, 160, 0.24), transparent 36%),
    var(--snoooz-bg);
}
.snoooz-net__container {
  width: 100%;
  max-width: var(--snoooz-max);
  margin: 0 auto;
  padding: 84px 24px 92px;
}
.snoooz-net h2, .snoooz-net p { margin-top: 0; }

/* Heading */
.snoooz-net__head { max-width: 680px; margin: 0 auto 8px; text-align: center; }
.snoooz-net__eyebrow {
  margin: 0 0 14px;
  color: var(--snoooz-primary);
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-size: 13px;
  font-weight: 700;
}
.snoooz-net__head h2 {
  margin: 0 0 14px;
  font-size: clamp(28px, 4vw, 43px);
  line-height: 1.08;
  letter-spacing: -0.038em;
  font-weight: 700;
}
.snoooz-net__head h2 .snoooz-net__hl {
  background: linear-gradient(100deg, var(--snoooz-primary) 0%, var(--snoooz-secondary-hover) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.snoooz-net__head p {
  max-width: 560px;
  margin: 0 auto;
  color: var(--snoooz-muted);
  font-size: 18px;
  line-height: 1.6;
}

/* Stage */
.snoooz-net__stage {
  position: relative;
  width: 100%;
  max-width: 880px;
  margin: 40px auto 0;
  padding-bottom: 54%;
}

/* Wires (SVG overlay) */
.snoooz-net__wires {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.snoooz-net__wire {
  fill: none;
  stroke: rgba(15, 91, 68, 0.28);
  stroke-width: 1.6;
  stroke-linecap: round;
}
.snoooz-net__dot {
  fill: var(--snoooz-dot);
  opacity: 0;
  filter: drop-shadow(0 0 4px rgba(24, 167, 108, 0.7));
}
.snoooz-net__wires marker path { fill: var(--snoooz-primary); }

/* Provider nodes + hub (positioned by their centers) */
.snoooz-net__node,
.snoooz-net__hub {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(223, 232, 226, 0.95);
  box-shadow: 0 14px 34px rgba(15, 91, 68, 0.1);
  opacity: 0;
  transition: opacity 0.5s ease;
}
.snoooz-net.is-visible .snoooz-net__node,
.snoooz-net.is-visible .snoooz-net__hub { opacity: 1; }

.snoooz-net__node {
  width: 66px; height: 66px;
  padding: 13px;
  z-index: 2;
}
.snoooz-net__node img { width: 100%; height: 100%; object-fit: contain; display: block; }
.snoooz-net__node-label {
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 12px;
  font-weight: 700;
  color: var(--snoooz-text);
}

/* Hub */
.snoooz-net__hub {
  width: 120px; height: 120px;
  padding: 22px;
  border-radius: 26px;
  border-color: rgba(15, 91, 68, 0.22);
  box-shadow: 0 22px 50px rgba(15, 91, 68, 0.2);
  z-index: 3;
}
.snoooz-net__hub img { width: 100%; height: 100%; object-fit: contain; display: block; }
.snoooz-net__hub::before {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 32px;
  border: 2px solid rgba(15, 91, 68, 0.18);
  animation: snoooz-net-pulse 2.6s ease-out infinite;
}
@keyframes snoooz-net-pulse {
  0%   { transform: scale(1);    opacity: 0.7; }
  70%  { transform: scale(1.16); opacity: 0; }
  100% { transform: scale(1.16); opacity: 0; }
}

/* Node positions (desktop ring) */
.snoooz-net__hub        { left: 50%; top: 49%; }
.snoooz-net__node--1    { left: 21%; top: 19%; }
.snoooz-net__node--2    { left: 79%; top: 19%; }
.snoooz-net__node--3    { left: 10%; top: 56%; }
.snoooz-net__node--4    { left: 90%; top: 56%; }
.snoooz-net__node--5    { left: 50%; top: 86%; }

/* Footer note */
.snoooz-net__note {
  max-width: 640px;
  margin: 30px auto 0;
  text-align: center;
  color: var(--snoooz-muted);
  font-size: 14.5px;
  line-height: 1.6;
}
.snoooz-net__note strong { color: var(--snoooz-text); font-weight: 700; }

/* Responsive */
@media (max-width: 640px) {
  .snoooz-net__container { padding: 60px 20px 68px; }
  .snoooz-net__stage { padding-bottom: 108%; max-width: 420px; }
  .snoooz-net__node { width: 50px; height: 50px; padding: 9px; border-radius: 14px; }
  .snoooz-net__node-label { font-size: 11px; top: calc(100% + 5px); }
  .snoooz-net__hub { width: 88px; height: 88px; padding: 16px; border-radius: 22px; }
  .snoooz-net__hub        { left: 50%; top: 46%; }
  .snoooz-net__node--1    { left: 23%; top: 14%; }
  .snoooz-net__node--2    { left: 77%; top: 14%; }
  .snoooz-net__node--3    { left: 15%; top: 44%; }
  .snoooz-net__node--4    { left: 85%; top: 44%; }
  .snoooz-net__node--5    { left: 50%; top: 80%; }
}

@media (prefers-reduced-motion: reduce) {
  .snoooz-net__node,
  .snoooz-net__hub { transition: none; }
  .snoooz-net__hub::before { animation: none; }
}

</style>
</head>
<body>
<section class="snoooz-net" id="snooozNetSection" aria-label="Works with every email provider">
  <div class="snoooz-net__container">

    <div class="snoooz-net__head">
      <p class="snoooz-net__eyebrow">Integrations</p>
      <h2>Works with <span class="snoooz-net__hl">every email provider</span>.</h2>
      <p>Gmail, Outlook, Yahoo, Apple Mail, and any IMAP or SMTP inbox connect to Snoooz in minutes.</p>
    </div>

    <div class="snoooz-net__stage" id="snooozNet">
      <svg class="snoooz-net__wires" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <marker id="snooozArrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0 0L10 5L0 10z" fill="var(--snoooz-primary)"></path>
          </marker>
        </defs>
      </svg>

      <!-- Provider nodes -->
      <div class="snoooz-net__node snoooz-net__node--1">
        <img src="https://snoooz.ai/hubfs/gmail_logo.png" alt="Gmail" loading="lazy">
        <span class="snoooz-net__node-label">Gmail</span>
      </div>
      <div class="snoooz-net__node snoooz-net__node--2">
        <img src="https://snoooz.ai/hubfs/outlook_logo.png" alt="Outlook" loading="lazy">
        <span class="snoooz-net__node-label">Outlook</span>
      </div>
      <div class="snoooz-net__node snoooz-net__node--3">
        <img src="https://snoooz.ai/hubfs/mini-hero-mail.png" alt="Apple Mail" loading="lazy">
        <span class="snoooz-net__node-label">Apple Mail</span>
      </div>
      <div class="snoooz-net__node snoooz-net__node--4">
        <img src="https://snoooz.ai/hubfs/yahoo-logo-illustration-in-square-background-free-png.png.webp" alt="Yahoo Mail" loading="lazy">
        <span class="snoooz-net__node-label">Yahoo</span>
      </div>
      <div class="snoooz-net__node snoooz-net__node--5">
        <img src="https://snoooz.ai/hubfs/smtp.webp" alt="IMAP and SMTP" loading="lazy">
        <span class="snoooz-net__node-label">IMAP / SMTP</span>
      </div>

      <!-- Snoooz hub -->
      <div class="snoooz-net__hub">
        <img src="https://snoooz.ai/hubfs/Snoooz%20Logo-1.png" alt="Snoooz">
      </div>
    </div>

    <p class="snoooz-net__note">One assistant across all of them. <strong>Connect a mailbox and Snoooz starts working in minutes</strong>, with nothing to migrate.</p>

  </div>
</section>
<script>
/* ============================================================
   SNOOOZ HOMEPAGE — EMAIL PROVIDERS NETWORK SCRIPTS
   Paste into your HubSpot module JS field (or a <script> block
   placed after the HTML). Self-contained, no dependencies.

   Draws a connector arrow from each provider to the Snoooz hub between
   their real on-screen positions, then animates green dots flowing along
   each wire into the hub. Recomputes on resize; reduced-motion users get
   static wires with no flowing dots.
   ============================================================ */

(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById('snooozNet');
  if (!stage) return;
  var svg = stage.querySelector('.snoooz-net__wires');
  var hub = stage.querySelector('.snoooz-net__hub');
  var nodes = Array.prototype.slice.call(stage.querySelectorAll('.snoooz-net__node'));
  var section = document.getElementById('snooozNetSection') || stage;
  if (!svg || !hub || !nodes.length) return;

  var wires = [], dots = [], raf = null, visible = false, revealed = false;

  function centerOf(elm, base) {
    var b = elm.getBoundingClientRect();
    return {
      x: b.left - base.left + b.width / 2,
      y: b.top - base.top + b.height / 2,
      r: Math.max(b.width, b.height) / 2
    };
  }

  function clearGenerated() {
    var old = svg.querySelectorAll('.snoooz-net__wire, .snoooz-net__dot');
    Array.prototype.forEach.call(old, function (e) { e.remove(); });
    wires = []; dots = [];
  }

  function build() {
    var base = stage.getBoundingClientRect();
    if (!base.width) return;
    svg.setAttribute('viewBox', '0 0 ' + base.width + ' ' + base.height);
    clearGenerated();

    var hc = centerOf(hub, base);

    nodes.forEach(function (node, i) {
      var pc = centerOf(node, base);
      var dx = hc.x - pc.x, dy = hc.y - pc.y;
      var dist = Math.hypot(dx, dy) || 1;
      var ux = dx / dist, uy = dy / dist;
      var sx = pc.x + ux * (pc.r + 4), sy = pc.y + uy * (pc.r + 4);
      var ex = hc.x - ux * (hc.r + 9), ey = hc.y - uy * (hc.r + 9);

      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', 'M' + sx + ' ' + sy + ' L' + ex + ' ' + ey);
      path.setAttribute('class', 'snoooz-net__wire');
      path.setAttribute('marker-end', 'url(#snooozArrow)');
      svg.appendChild(path);

      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = revealed ? 0 : len;
      wires.push(path);

      if (!reduce) {
        for (var k = 0; k < 2; k++) {
          var c = document.createElementNS(NS, 'circle');
          c.setAttribute('r', '4');
          c.setAttribute('class', 'snoooz-net__dot');
          svg.appendChild(c);
          dots.push({ el: c, path: path, len: len, t: ((i * 0.17) + k * 0.5) % 1, speed: 0.0055 });
        }
      }
    });
  }

  function reveal() {
    revealed = true;
    section.classList.add('is-visible');
    wires.forEach(function (p, i) {
      p.style.transition = 'stroke-dashoffset 0.9s ease ' + (i * 0.09) + 's';
      p.style.strokeDashoffset = '0';
    });
  }

  function frame() {
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      d.t += d.speed;
      if (d.t > 1) d.t -= 1;
      var p = d.path.getPointAtLength(d.t * d.len);
      d.el.setAttribute('cx', p.x);
      d.el.setAttribute('cy', p.y);
      var f = Math.sin(d.t * Math.PI); /* fade in/out at the ends */
      d.el.setAttribute('opacity', (0.12 + 0.88 * f).toFixed(3));
    }
    raf = window.requestAnimationFrame(frame);
  }
  function startDots() { if (reduce || raf) return; raf = window.requestAnimationFrame(frame); }
  function stopDots() { if (raf) { window.cancelAnimationFrame(raf); raf = null; } }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      visible = e.isIntersecting;
      if (visible) { if (!revealed) reveal(); startDots(); }
      else stopDots();
    });
  }, { threshold: 0.2 });
  io.observe(stage);

  /* Build after layout settles */
  window.requestAnimationFrame(function () {
    build();
    if (visible) { reveal(); startDots(); }
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var wasRevealed = revealed;
      build();
      if (wasRevealed) {
        wires.forEach(function (p) { p.style.transition = 'none'; p.style.strokeDashoffset = '0'; });
      }
      if (visible) startDots();
    }, 180);
  });
})();

</script>
</body>
</html>
