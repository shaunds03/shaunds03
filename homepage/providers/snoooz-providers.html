<!-- ============================================================
     SNOOOZ HOMEPAGE — EMAIL PROVIDERS NETWORK HTML
     Paste into your HubSpot module HTML field (or a rich-text/HTML block).
     Requires the matching CSS and JS. The JS draws the gradient connector
     lines (recomputed each frame so they follow the floating tiles) and
     animates the green dots streaming into the Snoooz hub.
     ============================================================ -->

<section class="snoooz-net" id="snooozNetSection" aria-label="Works with every email provider">
  <div class="snoooz-net__container">

    <div class="snoooz-net__head">
      <p class="snoooz-net__eyebrow">Integrations</p>
      <h2>Works with <span class="snoooz-net__hl">every email provider</span>.</h2>
      <p>Gmail, Outlook, Yahoo, Apple Mail, and any IMAP or SMTP inbox connect to Snoooz in minutes.</p>
    </div>

    <div class="snoooz-net__stage" id="snooozNet">
      <svg class="snoooz-net__wires" preserveAspectRatio="none" aria-hidden="true">
        <defs id="snooozNetDefs"></defs>
      </svg>

      <!-- Provider nodes -->
      <div class="snoooz-net__node snoooz-net__node--1">
        <div class="snoooz-net__tile"><img src="https://snoooz.ai/hubfs/gmail_logo.png" alt="Gmail" loading="lazy"></div>
        <span class="snoooz-net__node-label">Gmail</span>
      </div>
      <div class="snoooz-net__node snoooz-net__node--2">
        <div class="snoooz-net__tile"><img src="https://snoooz.ai/hubfs/outlook_logo.png" alt="Outlook" loading="lazy"></div>
        <span class="snoooz-net__node-label">Outlook</span>
      </div>
      <div class="snoooz-net__node snoooz-net__node--3">
        <div class="snoooz-net__tile"><img src="https://snoooz.ai/hubfs/mini-hero-mail.png" alt="Apple Mail" loading="lazy"></div>
        <span class="snoooz-net__node-label">Apple Mail</span>
      </div>
      <div class="snoooz-net__node snoooz-net__node--4">
        <div class="snoooz-net__tile"><img src="https://snoooz.ai/hubfs/yahoo-logo-illustration-in-square-background-free-png.png.webp" alt="Yahoo Mail" loading="lazy"></div>
        <span class="snoooz-net__node-label">Yahoo</span>
      </div>
      <div class="snoooz-net__node snoooz-net__node--5">
        <div class="snoooz-net__tile"><img src="https://snoooz.ai/hubfs/smtp.webp" alt="IMAP and SMTP" loading="lazy"></div>
        <span class="snoooz-net__node-label">IMAP / SMTP</span>
      </div>

      <!-- Snoooz hub -->
      <div class="snoooz-net__hub">
        <span class="snoooz-net__hub-glow" aria-hidden="true"></span>
        <div class="snoooz-net__hub-tile"><img src="https://snoooz.ai/hubfs/Snoooz%20Logo-1.png" alt="Snoooz"></div>
      </div>
    </div>

    <p class="snoooz-net__note">One assistant across all of them. <strong>Connect a mailbox and Snoooz starts working in minutes</strong>, with nothing to migrate.</p>

  </div>
</section>
